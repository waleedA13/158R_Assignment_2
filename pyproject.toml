[project]
name = "cse158-assignment2"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src", "scripts"]
